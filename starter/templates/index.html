<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span aria-hidden="true">&#9790;</span> <span id="theme-toggle-label">Dark mode</span>
    </button>
  </header>
  <div id="sudoku-board"></div>
  <div class="controls">
    <div class="difficulty-control">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty" name="difficulty" aria-label="Select Sudoku difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="action-buttons">
      <button id="new-game" type="button">New Game</button>
      <button id="hint" type="button">Hint</button>
      <button id="check-solution" type="button">Check Solution</button>
    </div>
    <div class="game-status">
      <span id="timer" aria-label="Elapsed time" aria-live="polite">00:00</span>
      <span id="hints-used" aria-live="polite">Hints used: 0</span>
      <span id="message" role="status" aria-live="polite"></span>
    </div>
  </div>
  <section id="scoreboard" aria-labelledby="scoreboard-title">
    <h2 id="scoreboard-title">Top 10 Scores</h2>
    <div class="scoreboard-table-wrap">
      <table>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Player</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
      </table>
    </div>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
